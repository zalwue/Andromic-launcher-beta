name: Build Andromic Launcher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os_name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: Windows
            runner: windows-latest
            artifact_name: andromic-launcher-windows.exe
            dist_path: dist/andromic-launcher-windows.exe
            add_data: "assets;assets"
            icon_flag: "--icon=assets/icon.ico"
          - os_name: Linux
            runner: ubuntu-latest
            artifact_name: andromic-launcher-linux
            dist_path: dist/andromic-launcher-linux
            add_data: "assets:assets"
            icon_flag: ""
          - os_name: macOS
            runner: macos-latest
            artifact_name: andromic-launcher-macos
            dist_path: dist/andromic-launcher-macos.app
            add_data: "assets:assets"
            icon_flag: "--icon=assets/icon.png"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libxcb-cursor0 libxkbcommon-x11-0 libegl1 libgl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Build executable with PyInstaller
        run: pyinstaller --noconfirm --onefile --windowed --name "${{ matrix.artifact_name }}" ${{ matrix.icon_flag }} --add-data "${{ matrix.add_data }}" --collect-all PySide6 --hidden-import PySide6.QtCore --hidden-import PySide6.QtGui --hidden-import PySide6.QtWidgets main.py

      - name: Package macOS .app into .zip
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r andromic-launcher-macos.zip andromic-launcher-macos.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os_name }}-build
          path: |
            dist/andromic-launcher-windows.exe
            dist/andromic-launcher-linux
            dist/andromic-launcher-macos.zip
          if-no-files-found: ignore

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/andromic-launcher-windows.exe
            artifacts/andromic-launcher-linux
            artifacts/andromic-launcher-macos.zip
