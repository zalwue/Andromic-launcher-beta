[project]
name = "andromic-launcher"
version = "1.0.0"
description = "A lightweight offline Minecraft launcher"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
dependencies = ["PySide6>=6.6.3"]

[project.gui-scripts]
andromic = "andromic.ui.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["andromic*"]
